<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Born a Cat</title>
  <meta name="description" content="You are born as a cat, somewhere in the world. A short game about chance.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="screen" id="home">
    <p class="paw" aria-hidden="true">🐾</p>
    <h1>Born a Cat</h1>
    <p class="tagline">Somewhere in the world, a kitten opens its eyes.<br>It could be you.</p>
    <button id="born-btn" type="button">Be born</button>
  </main>

  <main class="screen hidden" id="birth">
    <p class="small">You were born in</p>
    <h2 id="city-name"></h2>
    <p id="city-line" class="tagline"></p>
    <p id="trait-line" class="tagline trait"></p>
    <button id="start-btn" type="button">Open your eyes</button>
    <button id="again-btn" type="button" class="secondary">Be born somewhere else</button>
  </main>

  <main class="screen hidden" id="event">
    <p class="small muted-top" id="event-count"></p>
    <p class="story" id="event-text"></p>
    <div class="choices" id="choices"></div>
  </main>

  <main class="screen hidden" id="result">
    <p class="story" id="result-text"></p>
    <button id="next-btn" type="button">Continue</button>
  </main>

  <main class="screen hidden" id="ending">
    <p class="paw" aria-hidden="true">🐾</p>
    <h2 id="ending-title"></h2>
    <p class="story" id="ending-text"></p>
    <button id="restart-btn" type="button">Be born again</button>
  </main>

  <script src="stories.js"></script>
  <script src="game.js"></script>
</body>
</html>
