<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Born a Cat</title>
  <meta name="description" content="You are born as a cat, somewhere in the world. A short game about chance.">
  <meta name="theme-color" content="#efe6d6">
  <link rel="icon" type="image/png" sizes="32x32" href="img/icon-32.png">
  <link rel="apple-touch-icon" href="img/icon-180.png">
  <!-- The preview shown when the link is shared (WhatsApp, X, Discord...) -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://therealvodkinha.github.io/born-a-cat/">
  <meta property="og:title" content="Born a Cat">
  <meta property="og:description" content="You are born as a cat, somewhere in the world. A short game about chance.">
  <meta property="og:image" content="https://therealvodkinha.github.io/born-a-cat/img/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Four painted cats in front of a sun, next to the title Born a Cat">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..900,0..100,0..1;1,9..144,300..900,0..100,0..1&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body data-mood="asleep">
  <div class="backdrop" id="backdrop" aria-hidden="true"></div>
  <div class="horizon" id="horizon" aria-hidden="true"></div>
  <button id="mute-btn" class="mute" type="button" aria-label="Turn sound off">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path class="speaker" d="M4 9 H8 L13 5 V19 L8 15 H4 Z"/>
      <path class="waves" d="M16 9 Q18 12 16 15 M18.5 6.5 Q22 12 18.5 17.5"/>
      <path class="cross" d="M16 9 L21 15 M21 9 L16 15"/>
    </svg>
  </button>

  <main class="screen" id="home">
    <div class="scene">
      <div class="disc"></div>
      <div class="cat-slot"></div>
    </div>
    <h1>Born <em>a</em> Cat</h1>
    <p class="tagline">Somewhere in the world, a kitten opens its eyes.<br>It could be you.</p>
    <button id="born-btn" type="button">Be born</button>
  </main>

  <main class="screen hidden" id="birth">
    <!-- The cat's papers: who it is, before its life begins. -->
    <article class="papers">
      <p class="papers-head"><span>Born a Cat</span><span>Cat passport</span></p>
      <div class="papers-main">
        <figure class="id-photo"><img class="id-scene" id="birth-scene" alt=""><div class="id-cat cat-slot"></div></figure>
        <div class="id-who">
          <p class="field">Born in</p>
          <h2 id="city-name"></h2>
          <p class="field">Name</p>
          <p class="cat-name" id="name-line"></p>
          <p class="name-meaning" id="name-meaning"></p>
        </div>
      </div>
      <dl class="id-rows">
        <div><dt class="field">Coat</dt><dd id="coat-line"></dd></div>
        <div><dt class="field">Nature</dt><dd id="trait-line"></dd></div>
        <div><dt class="field">Breed</dt><dd id="breed-line"></dd></div>
      </dl>
      <div class="origin" id="origin">
        <p class="origin-stamp" id="origin-stamp"></p>
        <p class="origin-odds" id="origin-odds"></p>
      </div>
      <p id="origin-line" class="origin-line"></p>
      <p class="mrz" id="mrz" aria-hidden="true"></p>
    </article>
    <div class="actions">
      <button id="start-btn" type="button">Open your eyes</button>
      <button id="again-btn" type="button" class="secondary">Be born somewhere else</button>
    </div>
  </main>

  <main class="screen hidden scene-screen" id="time">
    <div class="hero time-hero">
      <img class="hero-img" id="time-scene" alt="">
      <div class="time-title">
        <p class="label time-chapter" id="time-chapter"></p>
        <h2 class="time-age"><span id="time-age"></span></h2>
      </div>
    </div>
    <div class="walker"></div>
    <p class="fact did-you-know" id="time-fact"></p>
    <div class="actions">
      <button id="time-btn" type="button">Go on</button>
    </div>
  </main>

  <main class="screen hidden scene-screen" id="event">
    <header class="life">
      <p class="label" id="event-count"></p>
      <div class="paws" id="paws"></div>
    </header>
    <div class="cat-card" id="event-card"></div>
    <div class="status" id="status"></div>
    <p class="story" id="event-text"></p>
    <div class="choices" id="choices"></div>
    <div class="gesture hidden" id="gesture"></div>
  </main>

  <main class="screen hidden scene-screen" id="result">
    <div class="cat-card" id="result-card"></div>
    <div class="factors" id="factors"></div>
    <p class="story" id="result-text"></p>
    <p class="event-fact after-text" id="event-fact"></p>
    <div class="actions">
      <div class="gains" id="gains"></div>
      <button id="next-btn" type="button">Continue</button>
    </div>
  </main>

  <main class="screen hidden" id="farewell">
    <div class="scene">
      <div class="disc"></div>
      <div class="cat-slot"></div>
    </div>
    <p class="story farewell-line" id="farewell-1"></p>
    <p class="story farewell-line" id="farewell-2"></p>
    <p class="label farewell-line" id="farewell-3"></p>
    <div class="actions">
      <button id="farewell-btn" type="button" class="secondary">…</button>
    </div>
  </main>

  <main class="screen hidden" id="ending">
    <article class="end-card" id="end-card">
      <div class="hero end-hero">
        <img class="hero-img" id="end-scene" alt="">
        <p class="rarity" id="rarity"></p>
        <div class="hero-cat cat-slot"></div>
      </div>
      <div class="end-body">
        <p class="label" id="end-city"></p>
        <h2 id="ending-title"></h2>
        <p class="odds" id="odds"></p>
        <p class="end-life" id="end-life"></p>
        <p class="end-cause" id="end-cause"></p>
        <p class="story" id="ending-text"></p>
        <div class="journey after-text" id="journey">
          <p class="stars" id="stars"></p>
          <p class="journey-line" id="journey-line"></p>
          <p class="score-line" id="score-line"></p>
          <div class="awards" id="awards"></div>
        </div>
        <div class="status after-text" id="end-status"></div>
        <p class="fact after-text" id="fact"></p>
      </div>
    </article>
    <p class="found after-text" id="found"></p>
    <!-- always at the bottom of the screen, even before scrolling -->
    <div class="actions end-actions after-text">
      <p class="share-note" id="share-note" role="status"></p>
      <button id="share-btn" type="button">Share my cat</button>
      <button id="restart-btn" type="button" class="secondary">Be born again</button>
    </div>
  </main>
  <div class="confetti" id="confetti" aria-hidden="true"></div>

  <script src="art.js"></script>
  <script src="stories.js"></script>
  <script src="facts.js"></script>
  <script src="names.js"></script>
  <script src="odds.js"></script>
  <script src="rules.js"></script>
  <script src="rewards.js"></script>
  <script src="share.js"></script>
  <script src="sound.js"></script>
  <script src="game.js"></script>
</body>
</html>
